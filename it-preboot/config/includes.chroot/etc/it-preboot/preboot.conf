# IT Preboot non-secret configuration
COMPANY_NAME="Your Company"
ENVIRONMENT_NAME="IT Preboot"

# Azure Blob container URL WITHOUT a SAS query string.
# Example: https://storageaccount.blob.core.windows.net/machine-images
AZURE_CONTAINER_URL=""
AZURE_MANIFEST_BLOB="manifest.json"

# Local image cache. For large images this should normally be changed to a
# mounted USB SSD or another temporary disk with enough free space.
IMAGE_CACHE_ROOT="/var/tmp/it-preboot-images"

# L2TP/IPsec connection name and server. Secrets are in secrets.env.
VPN_CONNECTION_NAME="Corporate L2TP"
VPN_SERVER=""
